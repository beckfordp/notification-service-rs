# SPDX-License-Identifier: MIT

[package]
name = "notification-service"
description = "The notification-service binary: the wire-compatible port of the Scala notification-service (gluon ADR 0029)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
kafka-client = { path = "../../../../lib/gluon-rs/crates/kafka-client" }
kafka-event-consumer = { path = "../../../../lib/gluon-rs/crates/kafka-event-consumer" }
service-basics = { path = "../../../../lib/gluon-rs/crates/service-basics" }
telemetry = { path = "../../../../lib/gluon-rs/crates/telemetry" }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
schemars = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "time", "uuid"] }
thiserror = "2"
time = { version = "0.3", features = ["parsing", "serde-well-known"] }
tokio = { version = "1", features = ["macros", "net", "sync"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "testing"] }
service-testing = { path = "../../../../lib/gluon-rs/crates/service-testing" }
serde_json = "1"
time = { version = "0.3", features = ["macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
